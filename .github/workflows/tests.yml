name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio "moto[dynamodb]" boto3 opentelemetry-api opentelemetry-sdk opentelemetry-instrumentation-fastapi fastapi httpx "python-jose[cryptography]>=3.4.0"
      - name: Run tests
        run: pytest -q
