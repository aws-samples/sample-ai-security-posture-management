AWSTemplateFormatVersion: '2010-09-09'
Description: >
  AI SPM - Dedicated HTTPS ALB listener for the SPM dashboard + a CloudFront
  distribution in front of it, with TLS 1.2+ on both legs and access logging.
  Routes /spm/* to the SPM API and everything else to the SPM UI. Reuses the
  target groups exported by 01-spm-platform.yaml.

  Prerequisites (you own a DNS domain):
    * DashboardDomainName  - the name users browse to, e.g. spm.example.com.
      After deploy, point it (CNAME / Route 53 alias) at the
      SPMDistributionDomainName output.
    * CloudFrontCertificateArn - ACM certificate in us-east-1 covering
      DashboardDomainName.
    * OriginDomainName - a DNS name that resolves to your ALB, e.g.
      spm-origin.example.com (CNAME / Route 53 alias to the ALB DNS name).
    * AlbCertificateArn - ACM certificate in this stack's Region covering
      OriginDomainName.

Parameters:
  EnvironmentName:
    Type: String
    Default: ai-spm
  AlbArn:
    Type: String
    Description: ARN of your existing Application Load Balancer.
  ListenerPort:
    Type: Number
    Default: 8090
    Description: >
      Port for the dedicated SPM HTTPS listener on the ALB. The ALB security
      group must allow inbound traffic on this port from the CloudFront managed
      prefix list (com.amazonaws.global.cloudfront.origin-facing).
  DashboardDomainName:
    Type: String
    AllowedPattern: '^[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?(\.[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?)+$'
    Description: Dashboard hostname served by CloudFront, e.g. spm.example.com.
  CloudFrontCertificateArn:
    Type: String
    AllowedPattern: '^arn:aws[a-z-]*:acm:us-east-1:[0-9]{12}:certificate/.+$'
    Description: ACM certificate ARN in us-east-1 that covers DashboardDomainName.
  OriginDomainName:
    Type: String
    AllowedPattern: '^[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?(\.[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?)+$'
    Description: >
      DNS name that resolves to the ALB and matches AlbCertificateArn, e.g.
      spm-origin.example.com. CloudFront connects to it over HTTPS only.
  AlbCertificateArn:
    Type: String
    AllowedPattern: '^arn:aws[a-z-]*:acm:[a-z0-9-]+:[0-9]{12}:certificate/.+$'
    Description: ACM certificate ARN in this Region that covers OriginDomainName.
  AccessLogRetentionDays:
    Type: Number
    Default: 90
    MinValue: 1
    Description: Days to keep CloudFront access logs.

Resources:
  # ============ Dedicated HTTPS ALB Listener for SPM ============
  SPMALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref AlbArn
      Port: !Ref ListenerPort
      Protocol: HTTPS
      # TLS 1.3 + TLS 1.2 only, forward-secret ciphers.
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref AlbCertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !ImportValue
            Fn::Sub: ${EnvironmentName}-SPMUITargetGroup

  # /spm/* -> SPM API
  SPMAPIRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref SPMALBListener
      Priority: 1
      Conditions:
        - Field: path-pattern
          Values: ['/spm/*']
      Actions:
        - Type: forward
          TargetGroupArn: !ImportValue
            Fn::Sub: ${EnvironmentName}-SPMAPITargetGroup

  # ============ CloudFront access logs ============
  # CloudFront standard logging writes with S3 ACLs, so this bucket uses
  # BucketOwnerPreferred object ownership. Public access stays fully blocked.
  SPMAccessLogsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: This is the access-log destination; logging it to itself would loop.
    Properties:
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-access-logs
            Status: Enabled
            ExpirationInDays: !Ref AccessLogRetentionDays
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  SPMAccessLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SPMAccessLogsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt SPMAccessLogsBucket.Arn
              - !Sub ${SPMAccessLogsBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # ============ CloudFront Distribution ============
  # CachePolicyId / OriginRequestPolicyId below are AWS-managed policies:
  #   4135ea2d-6df8-44a3-9df3-4b5a84be39ad = CachingDisabled
  #   b689b0a8-53d0-40ab-baf2-68738e2966ac = AllViewerExceptHostHeader (origin
  #     request). The origin receives Host: OriginDomainName, so CloudFront
  #     validates the ALB certificate against OriginDomainName.
  #   658327ea-f89d-4fab-a63d-7e88639e58f6 = CachingOptimized
  SPMDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub ${EnvironmentName} - AI SPM Dashboard
        Aliases:
          - !Ref DashboardDomainName
        ViewerCertificate:
          AcmCertificateArn: !Ref CloudFrontCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Logging:
          Bucket: !GetAtt SPMAccessLogsBucket.DomainName
          Prefix: cloudfront/
          IncludeCookies: false
        DefaultCacheBehavior:
          TargetOriginId: spm-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          Compress: true
        CacheBehaviors:
          - PathPattern: /spm/*
            TargetOriginId: spm-origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            Compress: true
          - PathPattern: /_next/static/*
            TargetOriginId: spm-origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            Compress: true
        Origins:
          - Id: spm-origin
            DomainName: !Ref OriginDomainName
            CustomOriginConfig:
              HTTPSPort: !Ref ListenerPort
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        PriceClass: PriceClass_100
        HttpVersion: http2and3

Outputs:
  SPMDashboardUrl:
    Description: AI SPM Dashboard URL
    Value: !Sub https://${DashboardDomainName}
  SPMDistributionDomainName:
    Description: Point DashboardDomainName (CNAME / Route 53 alias) at this name.
    Value: !GetAtt SPMDistribution.DomainName
  SPMDistributionId:
    Description: SPM CloudFront distribution ID
    Value: !Ref SPMDistribution
  SPMAccessLogsBucketName:
    Description: S3 bucket receiving CloudFront access logs
    Value: !Ref SPMAccessLogsBucket
