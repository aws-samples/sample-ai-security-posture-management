[project]
name = "ai-spm"
version = "1.0.0"
description = "AI Security Posture Management (Observe, Govern, Defend) for LiteLLM + Temporal + X-Ray AI platforms on AWS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT-0" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "boto3>=1.35.0",
    "temporalio>=1.7.0",
    "litellm>=1.50.0",
    "python-jose[cryptography]>=3.3.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "moto>=5.0",
]
diagram = [
    "diagrams>=0.23.0",
]
# Optional best-in-class OSS detectors. These pull in ML models (heavy) and are
# loaded only when present — the core solution runs without them.
security = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "llm-guard>=0.3",
]

[tool.setuptools.packages.find]
include = ["spm*"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
